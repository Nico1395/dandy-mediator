name: "Test projects"

on:
  pull_request:
    types: opened

env:
  SLN: "./src/DandyMediator.slnx"
  DOTNET_VERSION: "10.0.x"
  MEDIATOR_VALIDATION_TESTS_PROJ: "./src/DandyMediator.Validation.Tests/DandyMediator.Validation.Tests.csproj"

jobs:
  test:
    name: "Run unit tests"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v4"
      with:
        fetch-depth: 0

    - name: "Setup .NET"
      uses: "actions/setup-dotnet@v4"
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: "Restore dependencies"
      run: "dotnet restore ${{ env.SLN }}"

    - name: "Build solution"
      run: "dotnet build ${{ env.SLN }} --no-restore --configuration Release"

    - name: "Test Mediator.Validation.Tests"
      run: "dotnet test ${{ env.MEDIATOR_VALIDATION_TESTS_PROJ }} --no-restore --configuration Release"
